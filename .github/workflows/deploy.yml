# Deploy to Azure (infra/azure + deploy/aks). DISABLED BY DEFAULT, three ways (D23):
#   1. It never runs on push: only by pressing "Run workflow" (workflow_dispatch).
#   2. Every job is skipped unless the repository variable EVALHARNESS_DEPLOY_ENABLED is "true".
#   3. Jobs use the "azure" environment; give it required reviewers before enabling.
# Even then the default action is "plan", which changes nothing.
#
# No stored secrets: Azure login uses GitHub's OIDC token (a short-lived token GitHub issues to
# this run), trusted by a federated credential on an Entra ID app. The IDs below are repository
# *variables*, not secrets, because they identify, they don't authenticate.
name: deploy (disabled by default)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan shows changes; apply makes them (creates billable Azure resources)"
        type: choice
        options: [plan, apply]
        default: plan

permissions: {}

concurrency:
  group: deploy-azure
  cancel-in-progress: false  # never interrupt a half-finished apply

env:
  TF_VERSION: "1.17.1"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_api_authorized_ip_ranges: ${{ vars.AKS_API_AUTHORIZED_IP_RANGES }}  # JSON list
  TF_IN_AUTOMATION: "1"

jobs:
  infrastructure:
    if: vars.EVALHARNESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: azure
    permissions:
      contents: read
      id-token: write  # lets this job request an OIDC token for Azure
    defaults:
      run:
        working-directory: infra/azure
    outputs:
      acr: ${{ steps.out.outputs.acr }}
      cluster: ${{ steps.out.outputs.cluster }}
      rg: ${{ steps.out.outputs.rg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Use remote state in Azure Storage
        # The backend block lives only in CI, so local `terraform validate` needs no cloud.
        run: printf 'terraform {\n  backend "azurerm" {}\n}\n' > backend_override.tf
      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=evalharness.tfstate"
          -backend-config="use_azuread_auth=true"
      - run: terraform plan -input=false -out=tfplan
      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
      - id: out
        if: inputs.action == 'apply'
        run: |
          {
            echo "acr=$(terraform output -raw acr_login_server)"
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "rg=$(terraform output -raw resource_group_name)"
          } >> "$GITHUB_OUTPUT"

  application:
    needs: infrastructure
    if: vars.EVALHARNESS_DEPLOY_ENABLED == 'true' && inputs.action == 'apply'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      ACR: ${{ needs.infrastructure.outputs.acr }}
      CLUSTER: ${{ needs.infrastructure.outputs.cluster }}
      RG: ${{ needs.infrastructure.outputs.rg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push images
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          az acr login --name "${ACR%%.*}"
          docker build -t "$ACR/evalharness-sandbox:0.2.0" sandbox/
          docker build --target service -t "$ACR/evalharness-service:$version" .
          docker build --target evaluator -t "$ACR/evalharness-evaluator:$version" .
          for image in "evalharness-sandbox:0.2.0" "evalharness-service:$version" "evalharness-evaluator:$version"; do
            docker push "$ACR/$image"
          done
      - name: Cluster credentials (Entra ID; the cluster has no local accounts)
        run: |
          az aks install-cli --only-show-errors
          az aks get-credentials --resource-group "$RG" --name "$CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
      - name: Apply manifests
        run: |
          sed -i "s|ACR_LOGIN_SERVER|$ACR|g" deploy/aks/kustomization.yaml
          kubectl apply -k deploy/aks
          kubectl -n evalharness rollout status deploy/evalharness-service deploy/prometheus deploy/grafana --timeout=300s
          kubectl get runtimeclass
