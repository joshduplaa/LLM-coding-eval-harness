# Continuous integration: lint, tests (including the adversarial sandbox tests), image builds.
# It deploys nothing, pushes no images, and uses no secrets (see D18).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The job token can only read the repo. No job needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.2"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA; a tag can be moved, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  terraform:
    # Static checks only: no cloud credentials, no state, nothing created (D22).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: terraform test (mock provider, offline)
        run: terraform test

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Build sandbox image
        run: docker build -t evalharness-sandbox:0.2.0 sandbox/
      - name: Run all tests
        # REQUIRE_DOCKER makes a missing sandbox an error, so the security tests can never be
        # silently skipped in CI.
        env:
          EVALHARNESS_REQUIRE_DOCKER: "1"
        run: uv run pytest -q
      - name: No sandbox containers left behind
        run: test -z "$(docker ps -aq --filter label=evalharness=sandbox)"

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sandbox image
        run: docker build -t evalharness-sandbox:0.2.0 sandbox/
      - name: Build service image
        run: docker build --target service -t evalharness-service:0.5.0 .
      - name: Build evaluator image (service + checksum-verified kubectl)
        run: docker build --target evaluator -t evalharness-evaluator:0.5.0 .
      - name: Build evaluator image (service + checksum-verified kubectl)
        run: docker build --target evaluator -t evalharness-evaluator:0.5.0 .
      - name: Smoke-test service image
        run: scripts/smoke_service_image.sh evalharness-service:0.5.0
      - name: Image sizes
        run: docker images --filter reference='evalharness-*'
