id = "merge_intervals"
version = "1.0.0"
title = "Merge closed intervals"
entry_point = "merge_intervals"
signature = "def merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]:"
timeout_s = 10
description = """
Given closed integer intervals (start, end) with start <= end, in any order, merge every pair
that overlaps or touches (sharing an endpoint counts as touching: (1, 3) and (3, 5) merge into
(1, 5)). Return the merged intervals as tuples sorted by start. The input list must not be modified.
"""
