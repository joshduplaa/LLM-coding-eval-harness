# The same stack on AKS (infra/azure). Differences from kind:
#   - images come from the Azure Container Registry instead of being loaded into nodes
#   - sandbox pods go to the tainted "sandbox" node pool and run under Kata (one VM per pod)
# ACR_LOGIN_SERVER is replaced by the deploy workflow with `terraform output acr_login_server`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
images:
  - name: evalharness-service
    newName: ACR_LOGIN_SERVER/evalharness-service
patches:
  - target: {kind: Deployment, name: evalharness-service}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: ConfigMap, name: evaluator-config}
    patch: |-
      - op: replace
        path: /data/EVALHARNESS_SANDBOX_IMAGE
        value: ACR_LOGIN_SERVER/evalharness-sandbox:0.2.0
      - op: replace
        path: /data/EVALHARNESS_SANDBOX_PULL_POLICY
        value: IfNotPresent
      # AKS Pod Sandboxing's RuntimeClass. Check the name with `kubectl get runtimeclass`
      # after provisioning: if it doesn't exist, every sample is a harness_error (fail closed),
      # never an unsandboxed run.
      - op: add
        path: /data/EVALHARNESS_SANDBOX_RUNTIME_CLASS
        value: kata-vm-isolation
      - op: add
        path: /data/EVALHARNESS_SANDBOX_NODE_POOL
        value: sandbox
